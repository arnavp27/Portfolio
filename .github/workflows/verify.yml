name: Verify and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deployment:
        description: Publish a preview version or update the live site
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish tested build
        if: >-
          github.ref == 'refs/heads/main' &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deployment == 'production'))
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish tested preview
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.deployment == 'preview' &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: npm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
